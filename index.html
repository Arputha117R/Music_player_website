<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i>
                <h2>WaveStream</h2>
            </div>
            <nav>
                <ul>
                    <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
                    <li><a href="admin.html"><i class="fa-solid fa-gear"></i> Admin Panel</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search for songs, artists, or albums...">
                </div>
            </header>

            <div class="content-area">
                <h2>All Songs</h2>
                <div id="songsGrid" class="songs-grid">
                    <!-- Songs will be injected here by JS -->
                    <div class="loading">Loading songs...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="now-playing" id="nowPlaying">
            <img src="https://placehold.co/50x50/333/FFF?text=+" alt="Cover" id="playerCover">
            <div class="track-info">
                <h4 id="playerTitle">Select a song</h4>
                <p id="playerArtist">-</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playBtn" class="play-btn"><i class="fa-solid fa-circle-play"></i></button>
                <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100">
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="volume-control">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            <input type="range" id="volumeBar" value="100" min="0" max="100">
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="app.js"></script>
</body>
</html>
